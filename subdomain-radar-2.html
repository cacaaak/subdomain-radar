<style>
  :root{
    --bg:#0B1220;
    --panel:#101A2C;
    --panel-2:#131F34;
    --line:#22304A;
    --accent:#E8A33D;
    --accent-dim:#8A6428;
    --text:#E7ECF3;
    --muted:#7C8AA3;
    --ok:#4ADE80;
    --off:#4B5568;
    --danger:#E76A5E;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 50% -10%, #142238 0%, var(--bg) 55%);
    color:var(--text);
    font-family:"Space Grotesk", system-ui, sans-serif;
    min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .wrap{
    max-width:480px;
    margin:0 auto;
    padding:0 18px 32px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  header{
    padding:calc(env(safe-area-inset-top) + 22px) 0 16px;
    position:sticky;
    top:0;
    background:linear-gradient(to bottom, var(--bg) 78%, transparent);
    z-index:5;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
  }
  .brand svg{ width:26px; height:26px; flex-shrink:0; }
  .brand h1{
    font-size:17px;
    font-weight:600;
    letter-spacing:0.01em;
    margin:0;
  }
  .brand .sub{
    font-size:12px;
    color:var(--muted);
    margin-top:1px;
  }
  form{
    display:flex;
    gap:8px;
  }
  input[type="text"]{
    flex:1;
    min-width:0;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--mono);
    font-size:15px;
    padding:13px 14px;
    border-radius:10px;
    outline:none;
    transition:border-color .15s ease;
  }
  input[type="text"]::placeholder{ color:var(--muted); }
  input[type="text"]:focus{ border-color:var(--accent); }
  button{
    font-family:"Space Grotesk", sans-serif;
    font-weight:600;
    font-size:14.5px;
    border:none;
    border-radius:10px;
    padding:0 20px;
    cursor:pointer;
    background:var(--accent);
    color:#1B1002;
    transition:filter .15s ease, transform .1s ease;
  }
  button:active{ transform:scale(0.97); }
  button:disabled{ background:var(--accent-dim); color:#0006; cursor:default; }

  .options{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:12px;
    font-size:13px;
    color:var(--muted);
  }
  .options label{ display:flex; align-items:center; gap:7px; cursor:pointer; }
  .options input[type="checkbox"]{
    appearance:none;
    width:16px; height:16px;
    border:1.5px solid var(--line);
    border-radius:4px;
    background:var(--panel);
    display:grid;
    place-content:center;
    cursor:pointer;
  }
  .options input[type="checkbox"]::after{
    content:"";
    width:9px; height:9px;
    border-radius:2px;
    background:var(--accent);
    transform:scale(0);
    transition:transform .1s ease;
  }
  .options input[type="checkbox"]:checked::after{ transform:scale(1); }

  main{ flex:1; }

  .status-line{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:18px 2px 10px;
    font-size:12.5px;
    color:var(--muted);
    border-bottom:1px solid var(--line);
  }
  .status-line strong{ color:var(--text); font-weight:600; }

  .radar-loader{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:60px 0 40px;
    gap:16px;
    color:var(--muted);
    font-size:13px;
  }
  .radar-loader svg{ width:64px; height:64px; }
  .sweep{
    transform-origin:50px 50px;
    animation: spin 1.6s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){
    .sweep{ animation:none; }
  }

  ul.results{
    list-style:none;
    margin:0;
    padding:0;
  }
  ul.results li{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 2px;
    border-bottom:1px solid var(--line);
    font-family:var(--mono);
    font-size:13.5px;
  }
  ul.results li .dot{
    width:7px; height:7px;
    border-radius:50%;
    background:var(--off);
    flex-shrink:0;
  }
  ul.results li .dot.on{ background:var(--ok); box-shadow:0 0 6px #4ADE8080; }
  ul.results li .name{
    flex:1;
    min-width:0;
    overflow-wrap:anywhere;
    color:var(--text);
  }
  ul.results li .ip{
    color:var(--muted);
    font-size:12px;
    flex-shrink:0;
  }

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
    font-size:13.5px;
    line-height:1.6;
  }
  .empty b{ color:var(--text); }

  .error{
    margin-top:18px;
    padding:13px 14px;
    border:1px solid #6b2e2a;
    background:#22120f;
    color:#f2a89e;
    border-radius:10px;
    font-size:13px;
    line-height:1.5;
  }

  footer{
    padding-top:18px;
    display:flex;
    gap:10px;
  }
  .ghost-btn{
    flex:1;
    background:transparent;
    border:1px solid var(--line);
    color:var(--text);
    font-family:"Space Grotesk", sans-serif;
    font-size:13.5px;
    font-weight:500;
    padding:11px 0;
    border-radius:10px;
  }
  .ghost-btn:active{ background:var(--panel-2); }
  .ghost-btn:disabled{ opacity:0.4; }

  .note{
    margin-top:22px;
    font-size:11.5px;
    color:var(--muted);
    line-height:1.6;
    padding-top:14px;
    border-top:1px solid var(--line);
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="34" fill="none" stroke="#E8A33D" stroke-width="5"/><circle cx="50" cy="50" r="19" fill="none" stroke="#E8A33D" stroke-width="4" opacity="0.55"/><circle cx="50" cy="50" r="5" fill="#E8A33D"/></svg>
      <div>
        <h1>Subdomain Radar</h1>
        <div class="sub">Pencarian subdomain via Certificate Transparency</div>
      </div>
    </div>
    <form id="searchForm" autocomplete="off">
      <input id="domainInput" type="text" inputmode="url" placeholder="contoh.com" required>
      <button type="submit" id="searchBtn">Cari</button>
    </form>
    <div class="options">
      <label><input type="checkbox" id="resolveCheck"> Cek subdomain aktif (resolve IP)</label>
    </div>
  </header>

  <main id="main">
    <div class="empty">
      Masukkan sebuah domain untuk mulai memindai.<br>
      Contoh: <b>example.com</b>
    </div>
  </main>

  <div class="note">
    Data diambil dari log publik Certificate Transparency (crt.sh). Gunakan hanya pada domain milik sendiri atau yang sudah berizin untuk diuji.
  </div>
</div>

<script>
const form = document.getElementById('searchForm');
const input = document.getElementById('domainInput');
const btn = document.getElementById('searchBtn');
const main = document.getElementById('main');
const resolveCheck = document.getElementById('resolveCheck');
let lastResults = [];

function loaderHTML(){
  return `
    <div class="radar-loader">
      <svg viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="46" fill="none" stroke="#22304A" stroke-width="2"/>
        <circle cx="50" cy="50" r="30" fill="none" stroke="#22304A" stroke-width="2"/>
        <circle cx="50" cy="50" r="14" fill="none" stroke="#22304A" stroke-width="2"/>
        <g class="sweep">
          <path d="M50 50 L50 4 A46 46 0 0 1 88 27 Z" fill="#E8A33D" opacity="0.18"/>
          <line x1="50" y1="50" x2="50" y2="4" stroke="#E8A33D" stroke-width="2"/>
        </g>
        <circle cx="50" cy="50" r="3" fill="#E8A33D"/>
      </svg>
      <div>Memindai log sertifikat…</div>
    </div>`;
}

function emptyHTML(msg){
  return `<div class="empty">${msg}</div>`;
}

function errorHTML(msg){
  return `<div class="error">${msg}</div>`;
}

function escapeHTML(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function fetchWithTimeout(url, ms){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  try{
    return await fetch(url, { headers: { 'Accept': 'application/json, text/plain, */*' }, signal: controller.signal });
  } finally {
    clearTimeout(timer);
  }
}

function addMatching(set, raw, domain){
  let name = raw.trim().toLowerCase();
  if (name.startsWith('*.')) name = name.slice(2);
  if (name.endsWith(domain) && /^[a-z0-9_.-]+$/.test(name)){
    set.add(name);
  }
}

// Sumber 1: crt.sh (Certificate Transparency), lewat proxy karena crt.sh tidak kirim header CORS.
async function sourceCrtSh(domain){
  const target = `https://crt.sh/?q=%25.${encodeURIComponent(domain)}&output=json`;
  const urls = [
    target,
    `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(target)}`,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(target)}`
  ];
  let lastErr;
  for (const url of urls){
    try{
      const resp = await fetchWithTimeout(url, 20000);
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const raw = await resp.text();
      if (!raw.trim()) return new Set();
      let data;
      try{ data = JSON.parse(raw); }
      catch{ data = JSON.parse('[' + raw.trim().replace(/}\s*{/g, '},{') + ']'); }
      const set = new Set();
      for (const entry of data){
        for (const line of (entry.name_value || '').split('\n')) addMatching(set, line, domain);
      }
      return set;
    }catch(e){ lastErr = e; }
  }
  throw new Error('crt.sh: ' + (lastErr?.message || 'gagal'));
}

// Sumber 2: AnubisDB / jldc.me — agregator pasif DNS & sertifikat, JSON array of strings.
async function sourceAnubis(domain){
  try{
    const resp = await fetchWithTimeout(`https://jldc.me/anubis/subdomains/${encodeURIComponent(domain)}`, 15000);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    const set = new Set();
    for (const name of data) addMatching(set, name, domain);
    return set;
  }catch(e){ throw new Error('anubis: ' + e.message); }
}

// Sumber 3: HackerTarget hostsearch — CSV "subdomain,ip".
async function sourceHackerTarget(domain){
  try{
    const resp = await fetchWithTimeout(`https://api.hackertarget.com/hostsearch/?q=${encodeURIComponent(domain)}`, 15000);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const raw = await resp.text();
    if (/error|no records|api count exceeded/i.test(raw)) throw new Error(raw.trim().slice(0, 80));
    const set = new Set();
    for (const line of raw.split('\n')){
      const [name] = line.split(',');
      if (name) addMatching(set, name, domain);
    }
    return set;
  }catch(e){ throw new Error('hackertarget: ' + e.message); }
}

async function fetchSubdomains(domain){
  const sources = [sourceCrtSh, sourceAnubis, sourceHackerTarget];
  const settled = await Promise.allSettled(sources.map(fn => fn(domain)));

  const combined = new Set();
  const failures = [];
  let anySuccess = false;

  settled.forEach(result => {
    if (result.status === 'fulfilled'){
      anySuccess = true;
      result.value.forEach(s => combined.add(s));
    } else {
      failures.push(result.reason?.message || String(result.reason));
    }
  });

  if (!anySuccess){
    const err = new Error('Semua sumber gagal');
    err.detail = failures;
    throw err;
  }

  const list = Array.from(combined).sort();
  list._failures = failures; // info sumber yang gagal, ditampilkan sebagai catatan kecil
  return list;
}

function renderResults(domain, subs){
  const failures = subs._failures || [];
  const failureNote = failures.length
    ? `<div class="note" style="margin-top:14px; border-top:none; padding-top:0;">Sebagian sumber tidak merespons (hasil di bawah tetap valid dari sumber lain):<br>${failures.map(escapeHTML).join('<br>')}</div>`
    : '';

  if (subs.length === 0){
    main.innerHTML = emptyHTML(`Tidak ditemukan subdomain untuk <b>${escapeHTML(domain)}</b>.`) + failureNote;
    return;
  }
  const statusLine = `
    <div class="status-line">
      <span><strong>${subs.length}</strong> subdomain ditemukan</span>
      <span id="activeCount"></span>
    </div>`;
  const list = `<ul class="results" id="resultsList">${
    subs.map(s => `<li data-sub="${escapeHTML(s)}"><span class="dot"></span><span class="name">${escapeHTML(s)}</span><span class="ip"></span></li>`).join('')
  }</ul>`;
  main.innerHTML = statusLine + list + failureNote;

  if (resolveCheck.checked){
    resolveAll(subs);
  }
}

async function resolveAll(subs){
  const items = document.querySelectorAll('#resultsList li');
  let active = 0;
  const activeCountEl = document.getElementById('activeCount');

  // Resolusi DNS langsung dari browser tidak tersedia; gunakan DNS-over-HTTPS publik (Cloudflare).
  const checks = subs.map(async (sub, i) => {
    const li = items[i];
    try{
      const resp = await fetch(`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(sub)}&type=A`, {
        headers: { 'Accept': 'application/dns-json' }
      });
      const j = await resp.json();
      const answer = (j.Answer || []).find(a => a.type === 1);
      if (answer){
        li.querySelector('.dot').classList.add('on');
        li.querySelector('.ip').textContent = answer.data;
        active++;
      } else {
        li.querySelector('.ip').textContent = 'tidak aktif';
      }
    }catch{
      li.querySelector('.ip').textContent = '?';
    }
    if (activeCountEl) activeCountEl.textContent = `${active} aktif`;
  });

  await Promise.all(checks);
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  let domain = input.value.trim().toLowerCase();
  domain = domain.replace(/^https?:\/\//, '').replace(/\/.*$/, '');
  if (!domain) return;

  btn.disabled = true;
  btn.textContent = '...';
  main.innerHTML = loaderHTML();

  try{
    const subs = await fetchSubdomains(domain);
    lastResults = subs;
    renderResults(domain, subs);
  }catch(err){
    const detailLines = (err.detail || [err.message]).map(escapeHTML).join('<br>');
    main.innerHTML = errorHTML(
      `Gagal mengambil data untuk <b>${escapeHTML(domain)}</b>. Ini rincian percobaannya, boleh dikirim balik kalau mau dibantu cek:<br><br><span style="font-family:var(--mono); font-size:12px;">${detailLines}</span>`
    );
  }finally{
    btn.disabled = false;
    btn.textContent = 'Cari';
  }
});
</script>
</body>
</html>
